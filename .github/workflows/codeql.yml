name: CodeQL

# Análise de segurança do código (Kotlin e workflows).
# Configuração própria porque o projeto não tem gradlew: compila com o mesmo Gradle do build.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  schedule:
    - cron: "17 6 * * 1"   # toda segunda-feira

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - if: matrix.build-mode == 'manual'
        name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
