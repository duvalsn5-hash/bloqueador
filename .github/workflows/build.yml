name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # mudar só o README não gasta compilação
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Permissão mínima por padrão; só o job de build ganha escrita para publicar a release
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # necessário só para a etapa "Publicar release"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verificar se os Secrets da chave existem
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets da chave não encontrados (ex.: pull request de fork). Será gerado só um APK de teste, sem a assinatura oficial."
          fi

      - name: Compilar release assinado
        if: steps.chave.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          gradle assembleRelease --no-daemon
          rm -f "$KEYSTORE_PATH"
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/Bloqueador-Iahope-Technology.apk"

      - name: Compilar APK de teste (sem chave oficial)
        if: steps.chave.outputs.ok != 'true'
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk "saida/Bloqueador-TESTE.apk"

      # Em pull requests, guarda o APK de teste como artefato.
      # Se a cota de artefatos da conta estiver cheia, isso não derruba a compilação.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: Bloqueador-apk
          path: saida/*.apk
          retention-days: 1

      # Publica o APK oficial em Releases a cada envio para a main (não usa a cota de artefatos).
      # Link fixo: https://github.com/duvalsn5-hash/bloqueador/releases/latest/download/Bloqueador-Iahope-Technology.apk
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="saida/Bloqueador-Iahope-Technology.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK oficial não encontrado (Secrets da chave ausentes?). Nada publicado."
            exit 1
          fi
          VERSAO=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSAO"
          NOTAS="Bloqueador de Anúncios $VERSAO
          Desenvolvido por Edivaldo Nascimento · Iahope-Technology

          Instale o arquivo Bloqueador-Iahope-Technology.apk abaixo."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Bloqueador $VERSAO" --notes "$NOTAS" --latest
          fi
