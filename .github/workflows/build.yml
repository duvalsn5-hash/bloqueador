name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]   # mudar só o README não gasta compilação
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Permissão mínima: o build só precisa ler o código
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Verificar se os Secrets da chave existem
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets da chave não encontrados (ex.: pull request de fork). Será gerado só um APK de teste, sem a assinatura oficial."
          fi

      - name: Compilar release assinado
        if: steps.chave.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          gradle assembleRelease --no-daemon
          rm -f "$KEYSTORE_PATH"
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/Bloqueador-Iahope-Technology.apk"

      - name: Compilar APK de teste (sem chave oficial)
        if: steps.chave.outputs.ok != 'true'
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk "saida/Bloqueador-TESTE.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Bloqueador-apk
          path: saida/*.apk
          retention-days: 30
